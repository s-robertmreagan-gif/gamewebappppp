<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArcadeHub</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b12;
            color: white;
        }

        header {
            padding: 25px;
            text-align: center;
            background: #11111c;
            border-bottom: 1px solid #29293a;
        }

        header h1 {
            margin: 0;
            font-size: 35px;
        }

        header p {
            color: #999;
        }

        #games {
            max-width: 1200px;
            margin: 40px auto;
            padding: 20px;

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: #151522;
            border: 1px solid #29293a;
            border-radius: 15px;
            padding: 20px;
            transition: 0.2s;
        }

        .game-card:hover {
            transform: translateY(-5px);
            border-color: #6666ff;
        }

        .game-icon {
            font-size: 50px;
        }

        .game-card h2 {
            margin: 10px 0;
        }

        .game-card p {
            color: #aaa;
            min-height: 45px;
        }

        .category {
            color: #7777ff;
            font-size: 14px;
        }

        .play-button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: #6666ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .play-button:hover {
            background: #7777ff;
        }

        .loading {
            text-align: center;
            color: #aaa;
            grid-column: 1 / -1;
        }
    </style>
</head>

<body>

<header>
    <h1>🎮 ARCADEHUB</h1>
    <p>Play games from the community</p>
</header>

<main id="games">
    <div class="loading">Loading games...</div>
</main>

<script src="script.js"></script>

</body>
</html>
